<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yeabess Real-time Online Chess</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        /* (이전 스타일 유지하되 대기실 UI 조금 개선) */
        * { box-sizing: border-box; }
        body { display: flex; flex-direction: column; align-items: center; background: #121212; color: #f1f1f1; font-family: sans-serif; margin: 0; padding-top: 20px; height: 100vh; overflow: hidden; }
        .top-panel { display: flex; justify-content: space-between; width: 520px; margin-bottom: 10px; }
        .score-board { display: flex; justify-content: space-between; flex-grow: 1; padding: 15px; background: #1e1e1e; border-radius: 12px; }
        .player-info { display: flex; flex-direction: column; width: 40%; }
        .timer { font-size: 1.8rem; font-family: monospace; font-weight: bold; }
        #board { display: grid; grid-template-columns: repeat(8, 65px); grid-template-rows: repeat(8, 65px); border: 12px solid #2b2b2b; border-radius: 8px; position: relative; }
        .square { width: 65px; height: 65px; display: flex; justify-content: center; align-items: center; font-size: 45px; cursor: pointer; }
        .white { background-color: #eeddbb; } .black { background-color: #997755; }
        .selected { background-color: #7b61ff !important; }
        .hint::after { content: ''; width: 20px; height: 20px; background: rgba(0,0,0,0.1); border-radius: 50%; position: absolute; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; border-radius: 8px; }
        .btn-ready { padding: 15px 40px; font-size: 1.5rem; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-panel">
        <div class="score-board">
            <div class="player-info" id="p-white">
                <div style="font-size:0.8rem">⚪ 백색 (Player 1)</div>
                <div class="timer" id="timer-W">05:00</div>
            </div>
            <div id="status" style="font-weight:bold; padding:10px;">연결 중...</div>
            <div class="player-info" id="p-black" style="text-align: right;">
                <div style="font-size:0.8rem">⚫ 흑색 (Player 2)</div>
                <div class="timer" id="timer-B">05:00</div>
            </div>
        </div>
    </div>

    <div id="board-container">
        <div id="board"></div>
        <div class="overlay" id="lobby-overlay">
            <h2 id="lobby-msg">서버에 연결 중입니다...</h2>
            <button class="btn-ready" id="btn-start" style="display:none;" onclick="clickStart()">게임 참여하기</button>
        </div>
    </div>

<script>
// --- 1. Firebase 설정 (이 부분을 본인의 키로 바꿔야 함) ---
apiKey: "AIzaSyAxDXVPA5PUwgoribbQeIuy5ABlfUSqNU0",
  authDomain: "yeabess-chess.firebaseapp.com",
  projectId: "yeabess-chess",
  storageBucket: "yeabess-chess.firebasestorage.app",
  messagingSenderId: "855468041242",
  appId: "1:855468041242:web:0537fdd2c60b71b23cdda3",
  measurementId: "G-EW3LGQH723"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const gameRef = db.ref('chessGame');

// --- 2. 게임 상태 변수 ---
let myColor = null; // 'W' 또는 'B' 또는 'spectator'
let board = [];
let turn = 'W';
let gameActive = false;
let timeLeft = { W: 300, B: 300 };
let timerInterval = null;

// --- 3. 온라인 동기화 로직 ---
function initOnline() {
    // 플레이어 참여 처리
    gameRef.child('players').transaction((players) => {
        if (!players) players = { count: 0 };
        if (players.count < 2) {
            players.count++;
            return players;
        }
        return; // 이미 2명임
    }, (error, committed, snapshot) => {
        const count = snapshot.val().count;
        if (count === 1) myColor = 'W';
        else if (count === 2) myColor = 'B';
        else myColor = 'spectator';

        document.getElementById('lobby-msg').innerText = 
            myColor === 'spectator' ? "방이 가득 찼습니다. 관전 중..." : 
            `${myColor === 'W' ? '백색' : '흑색'}으로 배정되었습니다.`;
        document.getElementById('btn-start').style.display = 'block';
    });

    // 데이터베이스 변경 감지 (보드, 턴, 시간)
    gameRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        if (data.board) board = data.board;
        if (data.turn) turn = data.turn;
        if (data.gameActive) {
            gameActive = true;
            document.getElementById('lobby-overlay').style.display = 'none';
        }
        render();
    });

    // 연결 끊김 감지
    gameRef.child('players').onDisconnect().remove();
}

function clickStart() {
    gameRef.child('ready').push(myColor);
    gameRef.child('ready').on('value', (snap) => {
        if (Object.keys(snap.val() || {}).length >= 2) {
            gameRef.update({ gameActive: true, turn: 'W' });
        } else {
            document.getElementById('lobby-msg').innerText = "다른 플레이어를 기다리는 중...";
            document.getElementById('btn-start').style.display = 'none';
        }
    });
}

// 기물을 움직이면 서버에 업데이트
function executeMove(fr, fc, tr, tc) {
    if (turn !== myColor) return; // 내 차례 아니면 무시

    // ... (기존 이동 로직 처리 후) ...
    
    gameRef.update({
        board: board,
        turn: turn === 'W' ? 'B' : 'W'
    });
}

// (이하 기존 체스 렌더링 및 행마 로직 포함...)
// 전체 코드는 길어지므로 핵심 로직 위주로 재구성했습니다. 
// 기존의 getLegalMoves, render 함수들을 그대로 넣으되, 
// handleClick 안에서 내 색깔(myColor)과 현재 턴(turn)이 맞는지 확인하는 조건만 추가하면 됩니다.

initOnline();
</script>
</body>
</html>
